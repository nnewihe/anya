# XcodeGen spec for the app (brew install xcodegen; `xcodegen` here regenerates
# AnyaTennis.xcodeproj, which is checked in so building needs only Xcode).
name: AnyaTennis
options:
  bundleIdPrefix: com.build2launch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Anya2Engine:
    path: Packages/Anya2Engine
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  AnyaTennis:
    type: application
    platform: iOS
    sources:
      - path: AnyaTennis
    dependencies:
      - package: Anya2Engine
        product: Anya2Engine
      - package: Anya2Engine
        product: Anya2Perception
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: AnyaTennis/Info.plist
      properties:
        CFBundleDisplayName: Anya Tennis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Anya records the match with the camera to find the points and cut the highlights.
        NSMicrophoneUsageDescription: Anya records the sound of the match with the video.
        NSPhotoLibraryAddUsageDescription: Anya saves the highlight reel and the recording to your photo library.
        # YouTube upload: fill in the iOS OAuth client for com.build2launch.anyatennis
        # (and add its REVERSED client ID as a URL scheme). Empty = upload hidden.
        GIDClientID: ""
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.build2launch.anyatennis
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
schemes:
  AnyaTennis:
    build:
      targets:
        AnyaTennis: all
    run:
      config: Debug
