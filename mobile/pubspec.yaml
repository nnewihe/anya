name: anya_tennis
description: Cross-platform front end for the rally_detector pipeline.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Media
  file_picker: ^8.0.0          # pick a video from the device
  video_player: ^2.8.2         # play the resulting rally reel
  path_provider: ^2.1.2        # temp dirs for reference frames / reel
  flutter_svg: ^2.0.10+1       # render the Anya Tennis logo marks

  # On-device engine
  onnxruntime: ^1.4.1          # YOLO inference (CoreML/NNAPI/CPU) across platforms
  ffmpeg_kit_flutter_new: ^4.3.2  # mobile (android/ios) video decode + reel cut

  # Export / sharing
  gal: ^2.3.0                  # save reel video to native Photos/Gallery
  google_sign_in: ^6.2.1       # OAuth for YouTube upload scope
  http: ^1.2.0                 # resumable upload POST/PUT to YouTube Data API v3
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

# ffmpeg_kit_flutter_new declares macOS support, but its macOS artifact isn't
# shippable (see third_party/ffmpeg_kit_flutter_new/pubspec.yaml). Desktop
# already uses system ffmpeg via mobile/lib/engine/frame_source.dart's
# isMobilePlatform gate, so override with a trimmed android/ios-only copy to
# keep it out of the macOS build entirely.
dependency_overrides:
  ffmpeg_kit_flutter_new:
    path: third_party/ffmpeg_kit_flutter_new

flutter:
  uses-material-design: true
  assets:
    - assets/models/yolo26n.onnx
    - assets/models/ball_best.onnx
    - assets/images/
