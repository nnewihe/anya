; T-Watch 2020 remote for the court recorder (see ../README.md).
;     pio run -t upload                   build and flash a V3 over USB
;     pio run -e twatch2020-v2 -t upload  a V2 (V1: twatch2020-v1)
;     pio device monitor                  its log
;
; The three versions differ in pins (the backlight among them), and the chip
; can't tell which it's on: the wrong one gives a dark screen.  The version
; is printed on the back of the watch.

[platformio]
default_envs = twatch2020-v3

[env]
platform = espressif32@6.3.0
framework = arduino
board = ttgo-t-watch
board_build.partitions = default_16MB.csv
; 921600 corrupts on the 2020's CH9102 USB-serial chip ("Invalid head of packet")
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
    ; NimBLE: one connection (the Pi), central only
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    ; LilyGo's T-Watch 2020 library (display, touch, AXP202, LVGL 7), pinned
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#e5a0f825a21198f97d2bafee03ea853766483d20
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1

[env:twatch2020-v3]
build_flags = ${env.build_flags} -DANYA_WATCH_V=3

[env:twatch2020-v2]
build_flags = ${env.build_flags} -DANYA_WATCH_V=2

[env:twatch2020-v1]
build_flags = ${env.build_flags} -DANYA_WATCH_V=1
