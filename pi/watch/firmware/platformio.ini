; T-Watch S3 remote for the court recorder (see ../README.md).
;     pio run -t upload        build and flash over USB-C
;     pio device monitor       its log

[platformio]
default_envs = twatch-s3
; boards/LilyGoWatch-S3.json is LilyGo's own board file (16 MB flash, 8 MB PSRAM).
boards_dir = boards

[env:twatch-s3]
; The platform and library versions LilyGo builds the T-Watch S3 library with.
platform = espressif32@6.3.0
framework = arduino
board = LilyGoWatch-S3
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
build_flags =
    ; LilyGo: with USB CDC on, printing can block on battery.  Swap for
    ; -DARDUINO_USB_CDC_ON_BOOT=1 to read the log over USB while debugging.
    -UARDUINO_USB_CDC_ON_BOOT
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; TFT_eSPI: the watch's display, instead of its User_Setup.h
    -include include/tft_setup.h
    -DUSER_SETUP_LOADED
    ; NimBLE: one connection (the Pi), central only
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
    ; LilyGoLib (display, touch, AXP2101 power) + LVGL 8, pinned
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git#9884d62113cd2f7aa77cd179c346b9017eb08301
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
