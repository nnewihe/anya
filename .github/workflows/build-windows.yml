# Builds the Windows installer for the Anya Tennis desktop app.
#
# PyInstaller cannot cross-compile, so this is the only way to get a .exe
# without owning a Windows machine. Run it from the Actions tab
# ("Run workflow"), or push a desktop-v* tag to cut a release build.
#
# The artifact is AnyaTennis-Setup-<version>.exe — a single file to hand to a
# beta tester. It is NOT code-signed; see desktop/README.md.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    runs-on: windows-latest
    # The default 360 minutes is generous, but a ~2 GB bundle plus installer
    # compression is slow enough that the default 6-hour hang on a wedged step
    # would waste a lot of runner time before anyone noticed.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # NOT 3.12.0 — cpython#110543 makes PyInstaller emit a bundle that
          # dies at startup inside torch. build_windows.ps1 enforces this too;
          # pinning here means CI never even downloads the bad interpreter.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: desktop/requirements.txt

      # First, because it takes a second and everything below it takes
      # twenty minutes. A non-ASCII character in a .ps1 parses under pwsh 7
      # and not under Windows PowerShell 5.1, so it can reach CI green and
      # still break a developer's local build (or the reverse, which is how
      # it got here). See desktop/check_ps1_ascii.py.
      - name: Check PowerShell scripts are ASCII
        working-directory: desktop
        run: python check_ps1_ascii.py

      - name: Install Python dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          # -c constraints-windows.txt pins the stack to the versions the macOS
          # build is validated against. requirements.txt only sets floors, so
          # without this a runner resolves the newest of everything and ships
          # testers a Windows build made from different software than the Mac
          # one. That is not hypothetical: the first build resolved ultralytics
          # 8.4.118 against a Mac on 8.4.36 and died at startup.
          #
          # CPU-only torch. The default PyPI wheel on Windows already excludes
          # CUDA, but being explicit keeps a future default change from
          # quietly adding ~2 GB of CUDA libraries to a bundle that has no GPU
          # code path on Windows anyway.
          pip install -c constraints-windows.txt torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints-windows.txt -r requirements.txt
          # Leaves a record in the log of what was actually built against,
          # which is the first thing worth knowing when a build runs fine and
          # the app then won't start.
          pip list

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app and installer
        working-directory: desktop
        run: .\build_windows.ps1

      - name: Read app version
        id: version
        working-directory: desktop
        run: |
          $v = (python -c "import sys; sys.path.insert(0, '.'); from version import APP_VERSION; print(APP_VERSION)").Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AnyaTennis-Setup-${{ steps.version.outputs.version }}
          path: desktop/dist/AnyaTennis-Setup-*.exe
          # The default 90 days is longer than a beta build stays relevant,
          # and these are ~1 GB each against the repo's storage quota.
          retention-days: 14
          if-no-files-found: error

      # PyInstaller's warning file is the first thing worth reading when the
      # app builds but won't launch — a missing hidden import shows up there
      # and nowhere else. Kept separate so it can be downloaded without
      # pulling the gigabyte installer alongside it.
      #
      # The file is named after the SPEC (build/rally_app/warn-rally_app.txt),
      # not after the app. Globbing rather than hardcoding that, because the
      # first run pointed at build/AnyaTennis/ and silently uploaded nothing —
      # `if-no-files-found: ignore` meant the one artifact that would have
      # diagnosed the startup crash was quietly absent when it was needed.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-warnings
          path: desktop/build/*/warn-*.txt
          retention-days: 14
          if-no-files-found: warn
