# Rooted at desktop/ so `python -m pytest desktop/tests/` works from the repo
# root without desktop/ needing to be a package: the modules under test import
# each other as bare top-level names (`import auth`), matching how app.py sets
# up sys.path at runtime. conftest.py does the same for the suite.
[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
